<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pod Telemetry Console</title>
<meta name="description" content="Fresh Food Off Earth: what to eat first and which pods need venting, from sealed produce pods that sense ethylene.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="css/console.css">
</head>
<body>
<div class="console" id="console">

  <!-- ============ Status line ============ -->
  <header class="topbar">
    <div class="ident">Fresh Food Off Earth</div>
    <div class="clock" title="Mission elapsed time"><span class="k">MET</span><span class="v" id="clkMet">T+00:00:00</span></div>
    <button type="button" class="master" id="btnMaster" aria-live="assertive" aria-label="Master caution, no new alerts">Master caution</button>
  </header>

  <!-- ============ Crew view: eat order, readiness, venting ============ -->
  <main class="crew" id="crewView" role="tabpanel" aria-label="Crew">
    <!-- Appears only when the crew has to do something other than eat -->
    <ul class="notices" id="actions" aria-live="polite" hidden></ul>
    <section class="tiles" id="tiles" aria-label="Pods, numbered in the order to eat them"></section>
  </main>

  <!-- ============ Ethylene: one pod, one chart ============ -->
  <main class="monitor" id="monitorView" role="tabpanel" aria-label="Ethylene" hidden>
    <div class="podpick" id="podPick" role="tablist" aria-label="Pod"></div>

    <dl class="nums">
      <div><dt>Rise ppb</dt><dd id="numRise">N/A</dd></div>
      <div><dt>Rate ppb/h</dt><dd id="numRate">N/A</dd></div>
      <div><dt>Fan</dt><dd id="numFan">N/A</dd></div>
      <div class="nums-at"><dt>At</dt><dd id="numAt"></dd></div>
    </dl>

    <div class="mon-chart" id="cPrimary"></div>

    <aside class="mon-side">
      <section class="cam" id="camPanel" hidden aria-label="Camera">
        <div class="cam-view">
          <p class="cam-empty" id="camMsg">No camera</p>
          <img id="camImg" alt="Latest frame from the XIAO camera in POD-1" hidden>
        </div>
        <form class="cam-form" id="camForm" autocomplete="off">
          <label class="sr" for="camIp">Camera IP</label>
          <input id="camIp" inputmode="decimal" spellcheck="false" placeholder="Camera IP">
          <button type="submit" class="key" id="btnCam">Connect</button>
        </form>
        <p class="cam-meta" id="camMeta"></p>
      </section>
      <ol class="evlist" id="evList" aria-label="Events for this pod" aria-live="polite"></ol>
    </aside>
  </main>

  <!-- ============ Softkey menu ============ -->
  <footer class="menu">
    <nav class="keys" role="tablist" aria-label="Screens" id="viewTabs">
      <button type="button" class="key" role="tab" data-view="crew" aria-selected="true" aria-controls="crewView">Crew</button>
      <button type="button" class="key" role="tab" data-view="monitor" aria-selected="false" aria-controls="monitorView">Ethylene</button>
    </nav>

    <div class="keys" role="group" aria-label="Data source" id="modeSeg">
      <button type="button" class="key" data-mode="replay" aria-pressed="true">Replay</button>
      <button type="button" class="key" data-mode="live" aria-pressed="false">Live</button>
    </div>

    <div class="transport" id="replayBar">
      <button type="button" class="key icon" id="btnPlay" aria-label="Pause replay"><i class="ph ph-pause" aria-hidden="true"></i></button>
      <div class="keys" role="group" aria-label="Replay speed" id="speedSeg">
        <button type="button" class="key" data-speed="1" aria-pressed="false">1x</button>
        <button type="button" class="key" data-speed="10" aria-pressed="true">10x</button>
        <button type="button" class="key" data-speed="60" aria-pressed="false">60x</button>
      </div>
      <input type="range" id="scrub" min="0" max="14400" step="10" value="0" aria-label="Replay position">
      <label class="key icon" for="csvInput" title="Replay a CSV from the logging script as POD-1" aria-label="Load a CSV"><i class="ph ph-file-csv" aria-hidden="true"></i></label>
      <input type="file" id="csvInput" accept=".csv,.txt,text/csv" hidden>
    </div>

    <div class="transport" id="liveBar" hidden>
      <button type="button" class="key" id="btnSerial"><span>Connect DGS2</span></button>
      <span class="live-state" id="serialState">Sensor not connected</span>
    </div>

    <button type="button" class="key icon" id="btnMark" title="Mark load: produce went in now. Baseline = the two minutes before" aria-label="Mark load"><i class="ph ph-flag" aria-hidden="true"></i></button>
    <span class="foot-note" id="sbNote"></span>
    <span class="foot-src" id="sbSource"></span>
  </footer>
</div>

<div class="drop" id="drop" hidden><p>Drop the logging script CSV to replay it as POD-1</p></div>

<script src="js/config.js"></script>
<script src="js/icons.js"></script>
<script src="js/model.js"></script>
<script src="js/data.js"></script>
<script src="js/charts.js"></script>
<script src="js/live.js"></script>
<script src="js/app.js"></script>
</body>
</html>
